<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visible: Art of Living in AI search</title>
<style>
:root {
  --bg: #faf8f4; --panel: #ffffff; --ink: #1d1b18; --muted: #6b665e; --line: #e7e2d9;
  --accent: #c2541b; --accent-soft: #fbe9de; --good: #2f7d4f; --good-soft: #e3f2e8; --bad: #b3261e; --bad-soft: #fbe4e2;
  --sim: #6a4fb3; --sim-soft: #ece6fa; --bar: #d9d2c5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161513; --panel: #1f1d1a; --ink: #f1ede6; --muted: #a39d93; --line: #34312c;
    --accent: #ef8a50; --accent-soft: #3a2619; --good: #6cc48f; --good-soft: #1d3326; --bad: #f08a83; --bad-soft: #3a1f1d;
    --sim: #b39cf2; --sim-soft: #2a2340; --bar: #46423b;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 22px 16px 0; max-width: 1000px; margin: 0 auto; }
header h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; }
header h1 span { color: var(--accent); }
header p { margin: 6px 0 0; color: var(--muted); max-width: 680px; }
nav { max-width: 1000px; margin: 16px auto 0; padding: 0 16px; display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); }
nav button { background: none; border: 0; padding: 10px 12px; font: inherit; font-size: 15px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
nav button[aria-selected="true"] { color: var(--ink); border-color: var(--accent); font-weight: 600; }
main { max-width: 1000px; margin: 0 auto; padding: 16px 16px 48px; }
section[hidden] { display: none; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
.card h3 { margin: 0 0 6px; font-size: 15px; color: var(--muted); font-weight: 600; }
.big { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
.big small { font-size: 18px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; vertical-align: middle; }
.real { background: var(--good-soft); color: var(--good); }
.sim { background: var(--sim-soft); color: var(--sim); }
.draft { background: var(--accent-soft); color: var(--accent); }
h2 { font-size: 20px; margin: 28px 0 8px; }
.lead { font-size: 17px; max-width: 720px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th, td { text-align: left; padding: 9px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 13px; }
.yes { color: var(--good); font-weight: 600; } .no { color: var(--bad); font-weight: 600; }
.bars .row { display: grid; grid-template-columns: 170px 1fr 90px; gap: 10px; align-items: center; margin: 6px 0; font-size: 15px; }
.bars .track { background: var(--line); border-radius: 4px; height: 14px; overflow: hidden; }
.bars .fill { height: 100%; background: var(--bar); }
.bars .fill.listing { background: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 13px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; }
.task { border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 10px 0; background: var(--panel); }
.task-top { display: flex; gap: 12px; align-items: flex-start; }
.task input { margin-top: 5px; width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.task .t { font-weight: 650; font-size: 17px; }
.task ol { margin: 8px 0 0; padding-left: 20px; color: var(--muted); font-size: 15px; }
.who { display: inline-flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.pill { font-size: 13px; border-radius: 99px; padding: 2px 10px; background: var(--bg); border: 1px solid var(--line); }
.pill.easy { background: var(--good-soft); border-color: transparent; color: var(--good); font-weight: 600; }
pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow: auto; font-size: 13px; max-height: 380px; white-space: pre-wrap; word-break: break-word; }
button.primary { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer; }
button.ghost { background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 7px 12px; font: inherit; font-size: 14px; cursor: pointer; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
input[type=text] { font: inherit; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); min-width: 0; flex: 1 1 160px; }
details { margin-top: 16px; }
details > summary { cursor: pointer; font-weight: 600; color: var(--muted); padding: 8px 0; }
.callout { background: var(--accent-soft); border-radius: 12px; padding: 14px 16px; margin: 12px 0; font-size: 16px; }
.steps { counter-reset: s; display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin: 14px 0; }
.steps div { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 15px; }
.steps b { display: block; color: var(--accent); }
.result { border-bottom: 1px solid var(--line); padding: 10px 0; }
.result a { color: var(--accent); }
svg text { fill: var(--muted); font-size: 12px; }
.scroll { overflow-x: auto; }
.pmap { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; max-width: 760px; }
.prov { border-radius: 8px; padding: 8px 4px; text-align: center; font-size: 12px; line-height: 1.3; border: 1px solid var(--line); }
.prov b { display: block; font-size: 15px; }
.prov.zero { background: var(--bad-soft); color: var(--bad); }
.prov.some { background: var(--accent-soft); color: var(--accent); }
.prov.good { background: var(--good-soft); color: var(--good); }
.prov.none { color: var(--muted); }
.key { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: middle; margin: 0 2px 0 8px; }
.key.zero { background: var(--bad-soft); border: 1px solid var(--bad); } .key.some { background: var(--accent-soft); border: 1px solid var(--accent); } .key.good { background: var(--good-soft); border: 1px solid var(--good); }
@media (max-width: 600px) { .prov { padding: 6px 1px; font-size: 10px; } .prov b { font-size: 12px; } }
@media (max-width: 600px) { .bars .row { grid-template-columns: 110px 1fr 70px; font-size: 14px; } .big { font-size: 34px; } }
</style>
</head>
<body>
<header>
  <h1><span>Visible</span> · Can people find us through AI?</h1>
  <p>More and more people ask chatbots like ChatGPT "where can I learn meditation near me?". This page shows whether those answers mention Art of Living, what we can do about it, and whether it is working.</p>
</header>
<nav role="tablist">
  <button role="tab" data-tab="audit" aria-selected="true">1. How we're doing</button>
  <button role="tab" data-tab="lift">2. What to do next</button>
  <button role="tab" data-tab="fixes">3. Ready-made materials</button>
  <button role="tab" data-tab="feed">4. Program finder</button>
  <button role="tab" data-tab="retest">5. Track progress</button>
</nav>
<main>
  <section id="audit"></section>
  <section id="lift" hidden></section>
  <section id="fixes" hidden></section>
  <section id="feed" hidden></section>
  <section id="retest" hidden></section>
</main>
<script>window.VISIBLE_STATIC = true;</script>
<script>
const $ = (sel, el = document) => el.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
let S;
const STATIC = !!window.VISIBLE_STATIC;
const MEASURED = '<span class="tag real">Measured</span>';
const ESTIMATE = '<span class="tag sim">Estimate</span>';

function go(tab) {
  document.querySelectorAll('nav button').forEach((x) => x.setAttribute('aria-selected', x.dataset.tab === tab));
  document.querySelectorAll('main section').forEach((s) => (s.hidden = s.id !== tab));
  window.scrollTo(0, 0);
}
document.querySelectorAll('nav button').forEach((b) => b.addEventListener('click', () => go(b.dataset.tab)));
document.addEventListener('click', (e) => { const t = e.target.closest('[data-go]'); if (t) { e.preventDefault(); go(t.dataset.go); } });

const date = (iso) => new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });

const PROVINCES = [
  ['', '', '', '', '', '', '', '', '', 'NL'],
  ['', 'BC', 'AB', 'SK', 'MB', 'ON', 'QC', '', 'NB', 'PE'],
  ['', '', '', '', '', '', '', '', 'NS', ''],
];
const PNAME = { BC: 'British Columbia', AB: 'Alberta', SK: 'Saskatchewan', MB: 'Manitoba', ON: 'Ontario', QC: 'Québec', NB: 'New Brunswick', NS: 'Nova Scotia', PE: 'PEI', NL: 'Newfoundland' };

function provinceMap(byProv) {
  const cell = (p) => {
    if (!p) return '<div></div>';
    const v = byProv[p];
    if (!v) return `<div class="prov none" title="${PNAME[p]}: not tested yet"><b>${p}</b><span>not tested</span></div>`;
    const cls = v.mentioned === 0 ? 'zero' : v.mentioned / v.total < 0.5 ? 'some' : 'good';
    return `<div class="prov ${cls}" title="${PNAME[p]}"><b>${p}</b><span>${v.mentioned} of ${v.total}</span></div>`;
  };
  return `<div class="pmap">${PROVINCES.flat().map(cell).join('')}</div>
    <p class="muted small" style="margin:8px 0 0"><span class="key zero"></span> never came up <span class="key some"></span> came up sometimes <span class="key good"></span> came up often. Numbers: questions where we came up, out of questions asked in that province.</p>`;
}

function renderAudit() {
  const latest = S.runs[S.runs.length - 1];
  const unb = latest.queries.filter((q) => !q.branded);
  const brand = latest.queries.filter((q) => q.branded);
  const wins = unb.filter((q) => q.mentioned);
  const fr = unb.filter((q) => /FR/.test(q.intent));
  const top = latest.topSources.filter((s) => s.kind !== 'other').slice(0, 8);
  const cities = new Set(unb.map((q) => q.city).filter((c) => c !== 'Canada'));
  $('#audit').innerHTML = `
    <div class="steps">
      <div><b>1. We asked</b>${unb.length} everyday questions in ${cities.size} cities and every province, in English and French, like "meditation classes Calgary".</div>
      <div><b>2. We checked</b>whether the sources chatbots use for the answer include Art of Living.</div>
      <div><b>3. We found</b>where people are sent instead, and what we can fix.</div>
    </div>
    <div class="grid">
      <div class="card"><h3>Everyday questions that mention us ${MEASURED}</h3>
        <div class="big">${latest.unbrandedMentioned} <small>out of ${latest.unbrandedTotal}</small></div>
        <div class="muted">Someone new to meditation, asking for a class in their city, usually does not hear about Art of Living.</div></div>
      <div class="card"><h3>When people already know our name ${MEASURED}</h3>
        <div class="big">${brand.filter((q) => q.mentioned).length} <small>out of ${brand.length}</small></div>
        <div class="muted">Searching "Art of Living Montreal" or "Sudarshan Kriya course" finds us right away. The problem is reaching new people.</div></div>
    </div>
    <div class="callout"><b>The pattern:</b> we came up only in cities where we have our own centre page (Markham, Richmond Hill, Kitchener-Waterloo, Sherbrooke) or where our retreats are listed on a booking site. Everywhere else, chatbots send people to Eventbrite, Meetup and other groups. <a href="#" data-go="lift">See what to do next →</a></div>
    <h2>Across Canada</h2>
    <div class="card">${provinceMap(latest.byProvince)}</div>
    <h2>Where we did come up, and why</h2>
    <div class="card">${wins.map((q) => `<p style="margin:6px 0">✓ "${esc(q.query)}": <span class="muted">${esc(q.note ?? 'An Art of Living page came up.')}</span></p>`).join('')}</div>
    <h2>Where people are sent instead</h2>
    <div class="card"><div class="bars">${top.map((s) => `<div class="row"><span>${esc(s.name)}</span><div class="track"><div class="fill ${s.kind === 'listing' ? 'listing' : ''}" style="width:${(100 * s.queries) / top[0].queries}%"></div></div><span class="small muted">${s.queries} of ${latest.unbrandedTotal}</span></div>`).join('')}</div>
      <p class="muted small" style="margin-bottom:0"><span style="color:var(--accent);font-weight:600">Orange</span> = event and booking websites where volunteers can post our sessions. Grey = other meditation groups and course companies.</p></div>
    <h2>Every question we asked</h2>
    <p class="muted small">${fr.length} of these were asked in French, for Québec.</p>
    <div class="card scroll"><table><tr><th>What someone asked</th><th>Where</th><th>Did we come up?</th><th>Where they were sent</th></tr>
      ${latest.queries.map((q) => `<tr><td>"${esc(q.query)}"${q.branded ? ' <span class="muted small">(used our name)</span>' : ''}</td><td class="small">${esc(q.city)}</td>
        <td class="${q.mentioned ? 'yes' : 'no'}">${q.mentioned ? 'Yes' : 'No'}</td>
        <td><div class="chips">${q.sources.slice(0, 4).map((d) => `<span class="chip">${esc(d)}</span>`).join('')}</div></td></tr>`).join('')}</table></div>
    <h2>What we noticed on our own website ${MEASURED}</h2>
    <div class="card"><table><tr><th>What we found</th><th>Who can fix it</th></tr>
      ${S.siteFacts.facts.map((f) => `<tr><td>${f.severity === 'ok' ? '✓ ' : ''}${esc(f.plain)}</td><td class="muted small">${esc(f.who)}</td></tr>`).join('')}</table></div>
    <p class="muted small">How we checked, on ${date(latest.runAt)}: each question went through a live web search, the same step chatbots take before answering. We looked at the top 10 sources for each.</p>`;
}

function projected(selected) {
  const unb = S.runs[0].queries.filter((q) => !q.branded);
  let e = 0;
  for (const q of unb) {
    if (q.mentioned) { e++; continue; }
    e += 1 - selected.filter((a) => a.queryIds.includes(q.id)).reduce((m, a) => m * (1 - a.p), 1);
  }
  return Math.round(e);
}

function taskCard(a, checked) {
  const easy = a.who === 'Any volunteer';
  return `<div class="task"><div class="task-top"><input type="checkbox" data-id="${a.id}" ${checked ? 'checked' : ''} aria-label="Plan this task">
    <div><div class="t">${esc(a.plainTitle)}</div>
    <div class="who"><span class="pill ${easy ? 'easy' : ''}">${esc(a.who)}</span><span class="pill">${esc(a.time)}</span></div>
    <p style="margin:8px 0 0">${esc(a.why)}</p>
    <details style="margin-top:4px"><summary>How to do it</summary><ol>${a.steps.map((s) => `<li>${esc(s)}</li>`).join('')}</ol></details></div></div></div>`;
}

function renderLift() {
  const acts = S.plan.actions;
  const total = S.runs[0].unbrandedTotal;
  const first = acts.slice(0, 8);
  const rest = acts.slice(8);
  const ticked = new Set(acts.slice(0, 6).map((a) => a.id));
  $('#lift').innerHTML = `
    <p class="lead">Chatbots mostly repeat what they find on event websites. So the quickest win is simple: <b>post our sessions where chatbots already look</b>. Then improve our own pages. Tasks are sorted with the easiest and most useful first.</p>
    <div class="card"><h3>If we do the ticked tasks ${ESTIMATE}</h3>
      <div class="big" id="proj"></div>
      <div class="muted">Today: ${S.runs[0].unbrandedMentioned} out of ${total}. This is our best guess, not a measurement. After the tasks are done, "Track progress" checks the real number.</div></div>
    <h2>Tasks</h2>
    ${first.map((a) => taskCard(a, ticked.has(a.id))).join('')}
    ${rest.length ? `<details><summary>Show ${rest.length} smaller tasks</summary>${rest.map((a) => taskCard(a, false)).join('')}</details>` : ''}
    <p class="muted small">How the estimate works: we assume, for example, that a listing on an event website gets us into about a third of the answers where that website appears. Tick or untick tasks to see the estimate change.</p>`;
  const update = () => {
    const sel = [...document.querySelectorAll('#lift input:checked')].map((c) => acts.find((a) => a.id === c.dataset.id));
    $('#proj').innerHTML = `about ${projected(sel)} <small>out of ${total} questions</small>`;
  };
  $('#lift').addEventListener('change', update);
  update();
}

function renderFixes() {
  const f = S.fixes;
  const byPlatform = {};
  S.listings.forEach((l, i) => (byPlatform[l.platform] ??= []).push([l, i]));
  $('#fixes').innerHTML = `
    <p class="lead">Everything below is already written from our real course list. Copy it, check the details, and post it.</p>
    <h2>1. Event listings, ready to copy</h2>
    <p class="muted">For the websites chatbots look at most. Add the real date, place and registration link before posting.</p>
    ${Object.entries(byPlatform).map(([p, ls]) => `<details ${p === Object.keys(byPlatform)[0] ? 'open' : ''}><summary>${esc(p)} (${ls.length} listings)</summary>
      ${ls.map(([l, i]) => `<div class="card" style="margin:8px 0"><b>${esc(l.title)}</b>
        <p style="white-space:pre-line;margin:8px 0" class="small">${esc(l.body)}</p>
        <div class="chips" style="margin-bottom:8px">${l.tags.map((t) => `<span class="chip">${esc(t)}</span>`).join('')}</div>
        <button class="ghost" data-copy="${i}">Copy this listing</button></div>`).join('')}</details>`).join('')}
    <h2>2. Answers to common questions <span class="tag draft">Draft: a teacher checks before posting</span></h2>
    <div class="card">${f.faq.items.map((i) => `<p><b>${esc(i.question)}</b><br>${esc(i.answer)}</p>`).join('')}</div>
    <h2>3. En français, pour le Québec <span class="tag draft">Brouillon : à vérifier par un enseignant</span></h2>
    <div class="card">${S.faqFr.items.map((i) => `<p><b>${esc(i.question)}</b><br>${esc(i.answer)}</p>`).join('')}
      <p class="muted small" style="margin-bottom:0">French event listings for Montréal, Québec and Sherbrooke are in the listings above, marked "(français)".</p></div>
    <h2>4. New centre pages (preview)</h2>
    <p class="muted">Each page has a clear title, a short summary and the common questions, worded the way people actually ask.</p>
    <div class="card">${S.catalog.centres.map((c) => `<p style="margin:6px 0"><a href="fixes/city/${c.id}.html" target="_blank" style="color:var(--accent)">${esc(c.name)}</a></p>`).join('')}</div>
    <details><summary>For the website team: technical files</summary>
      <p class="small">Page titles and descriptions:</p><pre>${esc(f.centres.map((c) => `${c.meta.url}\n  title: ${c.meta.title}\n  description: ${c.meta.description}`).join('\n\n'))}</pre>
      <p class="small">Course schema (JSON-LD):</p><pre>${esc(JSON.stringify([f.organization, ...f.courses], null, 2))}</pre>
      <p class="small">FAQ schema (JSON-LD):</p><pre>${esc(JSON.stringify(f.faq.jsonLd, null, 2))}</pre>
      <p class="small">French FAQ schema (JSON-LD):</p><pre>${esc(JSON.stringify(S.faqFr.jsonLd, null, 2))}</pre>
      <p class="small">Canada llms.txt (guide file for AI tools):</p><pre>${esc(f.llmsTxt)}</pre>
    </details>`;
  $('#fixes').addEventListener('click', (e) => {
    if (!e.target.dataset.copy) return;
    const l = S.listings[+e.target.dataset.copy];
    navigator.clipboard?.writeText(`${l.title}\n\n${l.body}\n\nTags: ${l.tags.join(', ')}`).then(() => (e.target.textContent = 'Copied ✓'), () => {});
  });
}

function renderFeed() {
  $('#feed').innerHTML = `
    <p class="lead">Some chatbots can look things up directly from trusted sources instead of searching the web. We built a <b>program finder</b> they can use, so they get correct answers straight from us.</p>
    <div class="card"><h3>Try it the way a chatbot would</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0"><input type="text" id="ftopic" placeholder="What do you need? e.g. anxiety, sleep" value="anxiety">
      <input type="text" id="fcity" placeholder="City, e.g. Toronto" value="Toronto"><button class="primary" id="fgo">Find programs</button></div>
      <div id="fout" class="muted">Type a need and a city, then press Find programs.</div></div>
    <details><summary>For the technical team: connecting a chatbot</summary>
      <p class="small">MCP server with tools <code>find_programs</code>, <code>get_program</code>, <code>list_centres</code>. ${STATIC ? 'This page is static; run <code>npm start</code> on any Node host and connect to <code>/mcp</code>.' : `Connect to <code>${esc(location.origin)}/mcp</code>.`}</p>
      <pre>{ "mcpServers": { "art-of-living": { "command": "node", "args": ["scripts/mcp-stdio.js"] } } }</pre>
      <p class="small">Open files: <a href="feed.json">feed.json</a> · <a href="llms.txt">llms.txt</a></p></details>`;
  const run = async () => {
    const topic = $('#ftopic').value || undefined, city = $('#fcity').value || undefined;
    let out;
    if (STATIC) out = (await import('./search.js')).findPrograms(S.catalog, { topic, city });
    else out = await (await fetch('api/programs?' + new URLSearchParams({ topic: topic ?? '', city: city ?? '' }))).json();
    $('#fout').innerHTML = (out.programs.length ? out.programs.map((p) => `<div class="result"><b>${esc(p.name)}</b> <span class="muted small">${esc(p.level)}</span><br>${esc(p.description)}<br><a href="${esc(p.url)}" target="_blank">Official page →</a></div>`).join('') : '<p>No matching program.</p>')
      + (out.centres.length ? `<p class="small"><b>Nearby centres:</b> ${out.centres.map((c) => `<a href="${esc(c.url)}" target="_blank" style="color:var(--accent)">${esc(c.name)}</a>`).join(', ')}</p>` : '')
      + `<p class="muted small">${esc(out.note)}</p>`;
  };
  $('#fgo').addEventListener('click', run);
}

function renderRetest() {
  const runs = S.runs;
  $('#retest').innerHTML = `
    <p class="lead">After tasks are done, we ask the same questions again. Every check is saved here, so we can see real progress over time.</p>
    <div class="card scroll"><table><tr><th>Date</th><th>Everyday questions that mention us</th><th>Change</th></tr>
      ${runs.map((r, i) => `<tr><td>${date(r.runAt)}</td><td><b>${r.unbrandedMentioned} out of ${r.unbrandedTotal}</b> ${r.label === 'REAL' ? MEASURED : ESTIMATE}</td>
        <td>${i ? (r.unbrandedMentioned - runs[0].unbrandedMentioned >= 0 ? '+' : '') + (r.unbrandedMentioned - runs[0].unbrandedMentioned) : 'Starting point'}</td></tr>`).join('')}</table></div>
    <div class="card" style="margin-top:12px"><button class="primary" id="rgo" ${S.liveAuditAvailable ? '' : 'disabled'}>Check again now</button>
      <p class="muted small" id="rstatus" style="margin:8px 0 0">${S.liveAuditAvailable ? 'Asks a chatbot each question with live web search, located in Canada. Takes a few minutes.' : 'A team member with the technical setup runs the check (it needs an AI account key). The result then appears in the table above.'}</p></div>`;
  $('#rgo')?.addEventListener('click', async () => {
    $('#rgo').disabled = true;
    await fetch('api/audit/run', { method: 'POST' });
    const t = setInterval(async () => {
      const j = await (await fetch('api/audit/status')).json();
      $('#rstatus').textContent = j.running ? `Asking question ${j.done} of ${j.total}…` : j.error ? 'Something went wrong: ' + j.error : 'Done';
      if (!j.running) { clearInterval(t); load(); }
    }, 2000);
  });
}

async function load() {
  S = await (await fetch(STATIC ? 'state.json' : 'api/state')).json();
  renderAudit(); renderLift(); renderFixes(); renderFeed(); renderRetest();
}
load();
</script>
</body>
</html>
